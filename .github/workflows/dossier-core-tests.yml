name: DNS Energy core document regressions

on:
  push:
    branches: [deployment-prep]
    paths:
      - "backend/atr_doc.py"
      - "backend/atr_routes.py"
      - "backend/atr_equipment.py"
      - "backend/tests/test_atr_equipment_direct_catalog.py"
      - "backend/cef.py"
      - "backend/docgen.py"
      - "backend/diu_doc.py"
      - "backend/diu_routes.py"
      - "backend/schema_cef.py"
      - "backend/sizing.py"
      - "backend/supplier_catalog.py"
      - "backend/tests/test_cef_unknown_phases.py"
      - "backend/tests/test_deer_annex2_battery.py"
      - "backend/tests/test_pram_document_truthfulness.py"
      - "backend/tests/test_supplier_catalog.py"
      - "backend/tests/test_technical_parameter_safety.py"
      - "backend/templates/deer/**"
      - ".github/workflows/dossier-core-tests.yml"
      - "frontend/**"
  pull_request:
    branches: [deployment-prep]
    paths:
      - "backend/atr_doc.py"
      - "backend/atr_routes.py"
      - "backend/cef.py"
      - "backend/docgen.py"
      - "backend/diu_doc.py"
      - "backend/diu_routes.py"
      - "backend/schema_cef.py"
      - "backend/sizing.py"
      - "backend/supplier_catalog.py"
      - "backend/tests/test_cef_unknown_phases.py"
      - "backend/tests/test_deer_annex2_battery.py"
      - "backend/tests/test_pram_document_truthfulness.py"
      - "backend/tests/test_supplier_catalog.py"
      - "backend/tests/test_technical_parameter_safety.py"
      - "backend/templates/deer/**"
      - ".github/workflows/dossier-core-tests.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated test dependencies
        run: python -m pip install pytest reportlab python-docx pypdf httpx lxml
      - name: Run network-free core regression tests
        run: >-
          python -m pytest -c /dev/null -q
          tests/test_technical_parameter_safety.py
          tests/test_cef_unknown_phases.py
          tests/test_deer_annex2_battery.py
          tests/test_pram_document_truthfulness.py
          tests/test_supplier_catalog.py
          tests/test_atr_equipment_direct_catalog.py
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: corepack enable && yarn install --frozen-lockfile
      - name: Build staging frontend
        env:
          DISABLE_VISUAL_EDITS: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
          REACT_APP_BACKEND_URL: ""
        run: yarn build
