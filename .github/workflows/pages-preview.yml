name: Build DNS Energy preview

on:
  push:
    branches:
      - deployment-prep
      - dns-energy-mobile-dashboard
  pull_request:
    branches:
      - deployment-prep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        env:
          DISABLE_VISUAL_EDITS: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
          REACT_APP_BACKEND_URL: ""
          VITE_GITHUB_PAGES: "true"
        run: yarn build
      - name: Setup Python for backend syntax validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate backend Python syntax
        run: python -m compileall -q backend
      - name: Run offline technical safety tests
        working-directory: backend
        run: |
          python -m pip install pytest pytest-xdist
          python -m pytest -q tests/test_technical_parameter_safety.py
      - name: Save frontend preview files as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-energy-frontend-preview
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
