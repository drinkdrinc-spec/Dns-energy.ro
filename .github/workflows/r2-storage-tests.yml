name: DNS Energy R2 adapter tests

on:
  pull_request:
    paths:
      - "backend/r2_storage.py"
      - "backend/tests/test_r2_storage.py"
      - ".github/workflows/r2-storage-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/r2_storage.py"
      - "backend/tests/test_r2_storage.py"
      - ".github/workflows/r2-storage-tests.yml"

jobs:
  r2-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest boto3
      - name: Run isolated R2 adapter tests
        run: python -m pytest -q tests/test_r2_storage.py
