name: DNS Energy R2 adapter tests

on:
  pull_request:
    paths:
      - "backend/r2_storage.py"
      - "backend/tests/test_r2_storage.py"
      - "backend/ai_provider.py"
      - "backend/ai_routes.py"
      - "backend/ai_extract.py"
      - "backend/mailer.py"
      - "backend/requirements.txt"
      - ".github/workflows/r2-storage-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/r2_storage.py"
      - "backend/tests/test_r2_storage.py"
      - ".github/workflows/r2-storage-tests.yml"

jobs:
  r2-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest boto3 openai fastapi httpx python-dotenv
      - name: Compile independent provider modules
        run: python -m py_compile r2_storage.py ai_provider.py ai_routes.py ai_extract.py mailer.py
      - name: Run isolated R2 adapter tests
        run: python -m pytest -q tests/test_r2_storage.py
