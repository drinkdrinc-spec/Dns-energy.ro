name: DNS Energy dossier and catalog safety

on:
  push:
    branches: [deployment-prep, main]
    paths:
      - "backend/anre_doc.py"
      - "backend/ai_context.py"
      - "backend/ai_routes.py"
      - "backend/atr_doc.py"
      - "backend/cef.py"
      - "backend/diu_routes.py"
      - "backend/docgen.py"
      - "backend/equipment_extract.py"
      - "backend/gridfs_storage.py"
      - "backend/server.py"
      - "backend/sizing.py"
      - "backend/supplier_catalog.py"
      - "backend/tests/test_anre_gdpr_consent_truthfulness.py"
      - "backend/tests/test_cef_storage_truth.py"
      - "backend/tests/test_cef_unknown_phases.py"
      - "backend/tests/test_deer_annex2_battery.py"
      - "backend/tests/test_equipment_extract.py"
      - "backend/tests/test_pram_document_truthfulness.py"
      - "backend/tests/test_supplier_catalog.py"
      - "backend/tests/test_technical_parameter_safety.py"
      - ".github/workflows/anre-document-safety.yml"
  pull_request:
    paths:
      - "backend/anre_doc.py"
      - "backend/ai_context.py"
      - "backend/ai_routes.py"
      - "backend/atr_doc.py"
      - "backend/cef.py"
      - "backend/diu_routes.py"
      - "backend/docgen.py"
      - "backend/equipment_extract.py"
      - "backend/gridfs_storage.py"
      - "backend/server.py"
      - "backend/sizing.py"
      - "backend/supplier_catalog.py"
      - "backend/tests/test_anre_gdpr_consent_truthfulness.py"
      - "backend/tests/test_cef_storage_truth.py"
      - "backend/tests/test_cef_unknown_phases.py"
      - "backend/tests/test_deer_annex2_battery.py"
      - "backend/tests/test_equipment_extract.py"
      - "backend/tests/test_pram_document_truthfulness.py"
      - "backend/tests/test_supplier_catalog.py"
      - "backend/tests/test_technical_parameter_safety.py"
      - ".github/workflows/anre-document-safety.yml"
  workflow_dispatch:

jobs:
  dossier-catalog-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pytest pytest-xdist reportlab pypdf python-docx httpx lxml
      - name: Compile calculation and document modules
        run: python -m py_compile ai_context.py anre_doc.py ai_routes.py atr_doc.py cef.py docgen.py equipment_extract.py sizing.py supplier_catalog.py
      - name: Verify consent, storage, calculations, documents, and catalog safety
        run: >
          python -m pytest -q
          tests/test_anre_gdpr_consent_truthfulness.py
          tests/test_ai_context_privacy.py
          tests/test_cef_storage_truth.py
          tests/test_cef_unknown_phases.py
          tests/test_deer_annex2_battery.py
          tests/test_equipment_extract.py
          tests/test_pram_document_truthfulness.py
          tests/test_supplier_catalog.py
          tests/test_technical_parameter_safety.py
