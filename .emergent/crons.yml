crons:
  - name: billing-reminders
    description: "Trimite reamintiri de expirare a abonamentului cu 7 zile și 1 zi înainte"
    cron: "0 7 * * *"
    timezone: "Europe/Bucharest"
    endpoint: "{{BASE_URL}}/api/cron/billing-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: atr-deadlines
    description: "Reamintiri pentru termenele cererilor ATR (verificare documente, emitere aviz)"
    cron: "0 8 * * *"
    timezone: "Europe/Bucharest"
    endpoint: "{{BASE_URL}}/api/cron/atr-deadlines"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: forms-check
    description: "Verifică săptămânal linkurile și versiunile formularelor oficiale ale distribuitorilor"
    cron: "0 6 * * 1"
    timezone: "Europe/Bucharest"
    endpoint: "{{BASE_URL}}/api/cron/forms-check"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
