# Test deployment only. Uses free Render services and the approved Atlas test DB.
# The public dns-energy.ro domain is not attached by this Blueprint.
projects:
  - name: dns-energy
    environments:
      - name: test
        services:
          - type: web
            name: dns-energy-api-test
            runtime: python
            plan: free
            region: frankfurt
            branch: codex/render-preview
            rootDir: backend
            buildCommand: pip install -r requirements-render.txt
            startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /openapi.json
            envVars:
              - key: MONGO_URL
                sync: false
              - key: DB_NAME
                value: dns_energy_local
              - key: JWT_SECRET
                generateValue: true
              - key: ADMIN_EMAIL
                value: admin@dns-energy.ro
              - key: ADMIN_PASSWORD
                sync: false
              - key: EMERGENT_LLM_KEY
                sync: false
              - key: EMERGENT_EMAIL_KEY
                sync: false
              - key: EMAIL_FROM_NAME
                value: DNS Energy

          - type: web
            name: dns-energy-frontend-test
            runtime: static
            branch: codex/render-preview
            rootDir: frontend
            buildCommand: yarn install --frozen-lockfile && yarn build
            staticPublishPath: ./build
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: 22.22.0
              - key: REACT_APP_PRIVATE_LAUNCH
                value: "true"
              - key: REACT_APP_BACKEND_URL
                fromService:
                  type: web
                  name: dns-energy-api-test
                  envVarKey: RENDER_EXTERNAL_URL
