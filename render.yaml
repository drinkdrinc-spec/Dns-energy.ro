# Render Blueprint for a separate staging deployment.
# This does NOT change dns-energy.ro or the current Emergent deployment.
services:
  - type: web
    name: dns-energy-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: dns_energy
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: DNS_ENERGY_PRIVATE_MODE
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: INTEGRATION_PROXY_URL
        value: https://integrations.emergentagent.com

  - type: web
    name: dns-energy-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && DISABLE_VISUAL_EDITS=true DISABLE_EMERGENT_OVERLAY=true yarn build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://dns-energy-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
